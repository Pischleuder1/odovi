name: Versioned Release Stack acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/release-acceptance.yml"
      - "acceptance/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "dev/fixtures/**"
      - "packages/**"
      - "scripts/release-acceptance.sh"
      - "docker-compose*.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install acceptance dependencies
        run: npm ci --prefix acceptance/release-stack

      - name: Install Chromium
        run: npm exec --prefix acceptance/release-stack -- playwright install --with-deps chromium

      - name: Validate versioned release stack
        run: ./scripts/release-acceptance.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ github.sha }}
          path: acceptance-results/**/manifest.json
          if-no-files-found: error
          retention-days: 14
